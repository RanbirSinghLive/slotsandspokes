<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>airgame</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud">
      <div id="clock">Day 1 · 00:00 UTC</div>
      <div id="speed-controls">
        <button type="button" data-speed="0">Pause</button>
        <button type="button" data-speed="1" class="active">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="20">20×</button>
      </div>
    </div>
    <aside id="panel">
      <section id="econ-summary">
        <div class="econ-row"><span class="econ-label">Cash</span><span id="panel-cash" class="econ-value"></span></div>
        <h2>Today</h2>
        <div class="econ-row"><span class="econ-label">Revenue</span><span id="panel-revenue" class="econ-value"></span></div>
        <div class="econ-row"><span class="econ-label">Cost</span><span id="panel-cost" class="econ-value"></span></div>
        <div class="econ-row"><span class="econ-label">Margin</span><span id="panel-margin" class="econ-value"></span></div>
      </section>
      <section id="fleet-section">
        <h2>Fleet</h2>
        <table id="fleet-table">
          <thead>
            <tr>
              <th>Tail</th>
              <th>Type</th>
              <th>Status</th>
              <th>Where</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
