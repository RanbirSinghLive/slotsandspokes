<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>airgame</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="rotation-board" hidden>
      <div class="rotation-axis">
        <div class="rotation-axis-spacer"></div>
        <div id="rotation-axis-track" class="rotation-axis-track"></div>
      </div>
      <div id="rotation-rows"></div>
    </div>
    <div id="hud">
      <div id="clock">Day 1 · 00:00 UTC</div>
      <div id="speed-controls">
        <button type="button" data-speed="0">Pause</button>
        <button type="button" data-speed="1" class="active">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="20">20×</button>
      </div>
      <div id="view-toggle">
        <button type="button" data-view="map" class="active">Map</button>
        <button type="button" data-view="rotation">Rotation</button>
      </div>
    </div>
    <aside id="panel">
      <section id="econ-summary">
        <div class="econ-row"><span class="econ-label">Cash</span><span id="panel-cash" class="econ-value"></span></div>
        <h2>Today</h2>
        <div class="econ-row"><span class="econ-label">Revenue</span><span id="panel-revenue" class="econ-value"></span></div>
        <div class="econ-row"><span class="econ-label">Cost</span><span id="panel-cost" class="econ-value"></span></div>
        <div class="econ-row"><span class="econ-label">Margin</span><span id="panel-margin" class="econ-value"></span></div>
      </section>
      <section id="new-route-section" hidden>
        <h2 id="new-route-heading">New Route</h2>
        <div id="new-route-label"></div>
        <div id="new-route-block"></div>
        <label class="new-route-field">Tail
          <select id="new-route-tail"></select>
        </label>
        <label class="new-route-field">Depart
          <input type="time" id="new-route-depart" value="12:00" />
        </label>
        <div id="new-route-error"></div>
        <div class="new-route-actions">
          <button type="button" id="new-route-confirm">Add Route</button>
          <button type="button" id="new-route-cancel">Cancel</button>
        </div>
      </section>
      <section id="fleet-section">
        <h2>Fleet</h2>
        <table id="fleet-table" class="panel-table">
          <thead>
            <tr>
              <th>Tail</th>
              <th>Type</th>
              <th>Status</th>
              <th>Where</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="schedule-section">
        <h2>Schedule</h2>
        <table id="schedule-table" class="panel-table">
          <thead>
            <tr>
              <th>Tail</th>
              <th>Route</th>
              <th>Depart</th>
            </tr>
            <tr class="filter-row">
              <th><input type="text" id="schedule-filter-tail" placeholder="Filter" /></th>
              <th><input type="text" id="schedule-filter-route" placeholder="Filter" /></th>
              <th><input type="text" id="schedule-filter-depart" placeholder="Filter" /></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
